<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VaultLab Batch Pose Extractor</title>
  </head>
  <body>
    <input id="files" type="file" accept="video/*" multiple />
    <pre id="status">ready</pre>
    <script type="module">
      const status = document.getElementById("status");
      const fileInput = document.getElementById("files");
      const results = [];
      let poseTimestamp = 0;

      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const sigmoid = (value) => 1 / (1 + Math.exp(-value));

      function isVisible(point) {
        return Boolean(point && (point.visibility === undefined || point.visibility > 0.45));
      }

      function midpoint(pointA, pointB) {
        if (!isVisible(pointA) || !isVisible(pointB)) return null;
        return {
          x: (pointA.x + pointB.x) / 2,
          y: (pointA.y + pointB.y) / 2,
        };
      }

      function lineAngle(pointA, pointB) {
        if (!pointA || !pointB) return null;
        const radians = Math.atan2(pointA.y - pointB.y, pointB.x - pointA.x);
        return Math.abs((radians * 180) / Math.PI);
      }

      function angleBetween(pointA, pointB, pointC) {
        if (!isVisible(pointA) || !isVisible(pointB) || !isVisible(pointC)) return null;
        const vectorBA = { x: pointA.x - pointB.x, y: pointA.y - pointB.y };
        const vectorBC = { x: pointC.x - pointB.x, y: pointC.y - pointB.y };
        const dot = vectorBA.x * vectorBC.x + vectorBA.y * vectorBC.y;
        const lengthBA = Math.hypot(vectorBA.x, vectorBA.y);
        const lengthBC = Math.hypot(vectorBC.x, vectorBC.y);
        if (!lengthBA || !lengthBC) return null;
        const cosine = Math.max(-1, Math.min(1, dot / (lengthBA * lengthBC)));
        return (Math.acos(cosine) * 180) / Math.PI;
      }

      function buildFrameAnalysis(time, landmarks) {
        const shoulder = midpoint(landmarks[11], landmarks[12]);
        const hip = midpoint(landmarks[23], landmarks[24]);
        const ankle = midpoint(landmarks[27], landmarks[28]);
        const bodyLine = lineAngle(hip, shoulder);
        const inversionAngle = angleBetween(shoulder, hip, ankle);
        const visibleCount = landmarks.filter(isVisible).length;
        const inversionScore = shoulder && hip && ankle ? shoulder.y - hip.y + (shoulder.y - ankle.y) : -99;
        return { time, landmarks, shoulder, hip, ankle, bodyLine, inversionAngle, visibleCount, inversionScore };
      }

      function estimateTakeoffFrame(frames, inversionFrame) {
        const beforeInversion = frames.filter((frame) => frame.time < inversionFrame.time);
        const candidates = [];
        for (let index = 1; index < beforeInversion.length; index += 1) {
          const previous = beforeInversion[index - 1];
          const current = beforeInversion[index];
          if (!previous.hip || !current.hip) continue;
          const hipRise = previous.hip.y - current.hip.y;
          const bodyReady = Number.isFinite(current.bodyLine) ? current.bodyLine || 0 : 0;
          const score = hipRise * 100 + current.visibleCount * 0.2 - Math.abs(22 - bodyReady) * 0.08;
          candidates.push({ frame: current, score });
        }
        if (candidates.length) return candidates.sort((a, b) => b.score - a.score)[0].frame;
        return beforeInversion[Math.max(0, Math.floor(beforeInversion.length * 0.65))] || frames[0];
      }

      function estimateClearanceFrame(frames, inversionFrame) {
        const afterInversion = frames.filter((frame) => frame.time >= inversionFrame.time && frame.hip);
        if (!afterInversion.length) return inversionFrame;
        return afterInversion.slice().sort((a, b) => (a.hip?.y || 0) - (b.hip?.y || 0) || b.visibleCount - a.visibleCount)[0];
      }

      function estimateVaultPhases(frames) {
        const goodFrames = frames.filter((frame) => frame.visibleCount >= 16 && frame.hip && frame.shoulder);
        const usableFrames = goodFrames.length ? goodFrames : frames;
        const inversion = usableFrames
          .slice()
          .sort((a, b) => b.inversionScore - a.inversionScore || b.visibleCount - a.visibleCount)[0];
        return {
          takeoff: estimateTakeoffFrame(usableFrames, inversion),
          inversion,
          clearance: estimateClearanceFrame(usableFrames, inversion),
        };
      }

      function seekVideo(video, time) {
        return new Promise((resolve) => {
          const onSeeked = () => {
            video.removeEventListener("seeked", onSeeked);
            resolve();
          };
          video.addEventListener("seeked", onSeeked);
          video.currentTime = Math.min(Math.max(time, 0), video.duration || time);
        });
      }

      async function loadVideo(file) {
        const video = document.createElement("video");
        video.muted = true;
        video.playsInline = true;
        video.preload = "auto";
        video.src = URL.createObjectURL(file);
        document.body.appendChild(video);
        await new Promise((resolve, reject) => {
          video.onloadedmetadata = resolve;
          video.onerror = () => reject(new Error("video metadata failed"));
        });
        return video;
      }

      async function createModel() {
        const vision = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/+esm");
        const fileset = await vision.FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm",
        );
        return vision.PoseLandmarker.createFromOptions(fileset, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task",
            delegate: "CPU",
          },
          runningMode: "VIDEO",
          numPoses: 1,
        });
      }

      async function analyzeFile(model, file, index, total) {
        status.textContent = `loading ${index + 1}/${total}: ${file.name}`;
        const video = await loadVideo(file);
        const sampleCount = Math.min(80, Math.max(24, Math.round(video.duration * 8)));
        const frames = [];
        for (let frameIndex = 0; frameIndex < sampleCount; frameIndex += 1) {
          const time = (video.duration * frameIndex) / Math.max(1, sampleCount - 1);
          await seekVideo(video, time);
          poseTimestamp += 33;
          const result = model.detectForVideo(video, poseTimestamp);
          const landmarks = result.landmarks && result.landmarks[0];
          if (landmarks && landmarks.length) frames.push(buildFrameAnalysis(time, landmarks));
          if (frameIndex % 8 === 0) status.textContent = `analyzing ${index + 1}/${total}: ${file.name} ${Math.round((frameIndex / sampleCount) * 100)}%`;
          await sleep(0);
        }
        URL.revokeObjectURL(video.src);
        video.remove();

        if (frames.length < 3) {
          return {
            file: file.name,
            duration_s: video.duration,
            width: video.videoWidth,
            height: video.videoHeight,
            usable_frames: frames.length,
            takeoff_time_s: "",
            clearance_time_s: "",
            flight_time_s: "",
            takeoff_angle_deg: "",
            inversion_angle_deg: "",
            max_inversion_time_s: "",
            avg_visible_joints: frames.length ? frames.reduce((sum, frame) => sum + frame.visibleCount, 0) / frames.length : 0,
            status: "not_enough_pose_frames",
          };
        }

        const phases = estimateVaultPhases(frames);
        return {
          file: file.name,
          duration_s: video.duration,
          width: video.videoWidth,
          height: video.videoHeight,
          usable_frames: frames.length,
          takeoff_time_s: phases.takeoff.time,
          clearance_time_s: phases.clearance.time,
          flight_time_s: Math.max(0, phases.clearance.time - phases.takeoff.time),
          takeoff_angle_deg: phases.takeoff.bodyLine ?? "",
          inversion_angle_deg: phases.inversion.inversionAngle ?? "",
          max_inversion_time_s: phases.inversion.time,
          avg_visible_joints: frames.reduce((sum, frame) => sum + frame.visibleCount, 0) / frames.length,
          status: "ok",
        };
      }

      fileInput.addEventListener("change", async () => {
        window.__vaultLabDone = false;
        window.__vaultLabError = "";
        results.length = 0;
        try {
          const model = await createModel();
          const files = Array.from(fileInput.files || []);
          for (let index = 0; index < files.length; index += 1) {
            results.push(await analyzeFile(model, files[index], index, files.length));
          }
          status.textContent = `done ${results.length}`;
          window.__vaultLabResults = results;
          window.__vaultLabDone = true;
        } catch (error) {
          window.__vaultLabError = error instanceof Error ? error.message : String(error);
          status.textContent = window.__vaultLabError;
          window.__vaultLabDone = true;
        }
      });

      window.__vaultLabResults = results;
      window.__vaultLabDone = false;
      window.__vaultLabError = "";
    </script>
  </body>
</html>
